<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bombay Musk — Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --paper:#FAFAFA;
    --panel:#FFFFFF;
    --oud:#111111;
    --oud-deep:#000000;
    --oud-soft:#EDEDED;
    --musk:#111111;
    --musk-soft:#EDEDED;
    --amber-line:#DEDEDE;
    --danger:#111111;
    --danger-soft:#E4E4E4;
    --gold:#111111;
    --muted:#767676;
    --radius:14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px -12px rgba(0,0,0,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  ::selection{ background:var(--oud-soft); }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,0,0,0.05), transparent 45%),
      radial-gradient(circle at 88% 90%, rgba(0,0,0,0.045), transparent 45%),
      var(--paper);
    padding:24px; position:relative; overflow:hidden;
  }
  .login-stage{ position:relative; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; }
  .login-rings{
    position:absolute; top:150px; left:50%; width:540px; height:540px; transform:translate(-50%,-50%); pointer-events:none; z-index:0;
    -webkit-mask-image: radial-gradient(circle, black 45%, transparent 78%);
    mask-image: radial-gradient(circle, black 45%, transparent 78%);
  }
  .login-rings .ring{ position:absolute; border:1px solid rgba(17,17,17,0.07); border-radius:50%; animation: ringPulse 7s ease-in-out infinite; }
  .login-rings .r1{ inset:150px; animation-delay:0s; }
  .login-rings .r2{ inset:80px; animation-delay:1.4s; }
  .login-rings .r3{ inset:0; animation-delay:2.8s; }
  @keyframes ringPulse{
    0%,100%{ transform:scale(0.97); opacity:0.35; }
    50%{ transform:scale(1.03); opacity:0.9; }
  }
  .login-card{
    position:relative; z-index:1; width:100%; background:var(--panel); border-radius:22px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -20px rgba(0,0,0,0.22);
    padding:44px 34px 34px; border:1px solid var(--amber-line);
    animation: cardRise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardRise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  .login-footer{ margin-top:24px; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); text-align:center; position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce){
    .login-rings .ring{ animation:none; }
    .login-card{ animation:none; }
  }
  .wordmark{ text-align:center; margin-bottom:6px; }
  .seal{ display:flex; justify-content:center; margin-bottom:14px; }
  .seal img{ width:200px; max-width:78%; height:auto; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.04)); }
  .wordmark .top{ font-size:28px; line-height:1; color:var(--oud-deep); }
  .wordmark .bottom{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.3em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  .tagline{ text-align:center; color:var(--muted); font-size:12.5px; margin:4px 0 8px; letter-spacing:0.02em; }
  .login-divider{ height:1px; background:linear-gradient(to right, transparent, var(--amber-line), transparent); margin:24px 0 22px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--amber-line);
    background:#fff; font-size:15px; color:var(--ink); outline:none; transition:border-color .18s, box-shadow .18s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--ink); box-shadow:0 0 0 3.5px rgba(17,17,17,0.055); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:10px; border:none; font-weight:600; font-size:14px;
    transition:transform .12s, opacity .15s, box-shadow .2s, background .15s; letter-spacing:0.01em;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--oud); color:#fff; width:100%; }
  .btn-primary:hover{ background:var(--oud-deep); box-shadow:0 10px 24px -8px rgba(0,0,0,0.35); transform:translateY(-1px); }
  .btn-primary:active{ transform:translateY(0) scale(0.98); }
  .btn-ghost{ background:transparent; color:var(--oud); border:1.5px solid var(--amber-line); }
  .btn-ghost:hover{ border-color:var(--oud); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-success{ background:var(--musk-soft); color:var(--musk); }
  .login-hint{ margin-top:20px; padding:12px 14px; background:var(--oud-soft); border-radius:10px; font-size:12px; color:var(--oud-deep); line-height:1.5; }
  .login-error{ color:var(--danger); font-size:13px; margin-top:10px; text-align:center; min-height:18px; }

  /* ---------- App shell ---------- */
  #app{ display:none; min-height:100vh; padding-bottom:76px; position:relative; }
  .watermark{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-repeat:no-repeat; background-position:center 60vh; background-size:520px;
    opacity:0.05;
  }
  header.topbar, main, nav.tabbar{ position:relative; z-index:1; }
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--amber-line); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand-mini{ display:flex; align-items:center; gap:10px; }
  .brand-mini .mark{ width:36px;height:36px;border-radius:9px; background:#fff; border:1px solid var(--amber-line); display:flex;align-items:center;justify-content:center; overflow:hidden; }
  .brand-mini .name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.1; }
  .brand-mini .sub{ font-size:10.5px; color:var(--muted); letter-spacing:0.05em; }
  .user-chip{ display:flex; align-items:center; gap:10px; }
  .user-chip .who{ text-align:right; }
  .user-chip .who .n{ font-size:13px; font-weight:600; }
  .user-chip .who .r{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .avatar{ width:32px;height:32px;border-radius:50%; background:var(--musk-soft); color:var(--musk); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }

  main{ max-width:960px; margin:0 auto; padding:20px; }
  .page-title{ font-size:22px; margin:4px 0 3px; }
  .page-sub{ color:var(--muted); font-size:13.5px; margin-bottom:22px; }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--panel);
    border-top:1px solid var(--amber-line); display:flex; overflow-x:auto;
    box-shadow:0 -4px 16px rgba(36,26,18,0.06);
  }
  nav.tabbar .tab{
    flex:1; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 4px 8px; background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:600;
    letter-spacing:0.02em; border-top:2px solid transparent;
  }
  nav.tabbar .tab.active{ color:var(--oud); border-top-color:var(--oud); }
  nav.tabbar .tab .ic{ font-size:18px; line-height:1; }

  /* ---------- Cards / grid ---------- */
  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  @media (max-width:640px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--amber-line); border-radius:var(--radius); padding:18px; }
  .stat{ background:var(--panel); border:1px solid var(--amber-line); border-radius:var(--radius); padding:16px 18px; }
  .stat .num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--oud-deep); }
  .stat .lbl{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px; }
  .section-head h3{ font-size:15.5px; margin:0; }

  .clockcard{
    background:linear-gradient(135deg, var(--oud-deep), var(--oud)); color:#fff; border-radius:18px;
    padding:24px; text-align:center; box-shadow:var(--shadow);
  }
  .clockcard .time{ font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:500; letter-spacing:0.02em; }
  .clockcard .date{ font-size:12.5px; opacity:0.85; margin-top:2px; }
  .clockcard .status{ margin:14px 0 16px; font-size:13px; opacity:0.92; }
  .clockcard .bigbtn{
    background:#fff; color:var(--oud-deep); border:none; padding:14px 30px; border-radius:12px;
    font-weight:700; font-size:15px; width:100%;
  }
  .clockcard .bigbtn.out{ background:rgba(255,255,255,0.16); color:#fff; border:1.5px solid rgba(255,255,255,0.4); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:8px 10px; border-bottom:1.5px solid var(--amber-line); }
  td{ padding:10px 10px; border-bottom:1px solid var(--amber-line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  .pill{ display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  .pill-pending{ background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
  .pill-approved{ background:var(--ink); color:#fff; }
  .pill-rejected{ background:#fff; color:var(--muted); border:1.5px solid var(--amber-line); text-decoration:line-through; }
  .pill-present{ background:var(--ink); color:#fff; }
  .pill-absent{ background:#fff; color:var(--muted); border:1.5px solid var(--amber-line); text-decoration:line-through; }
  .pill-todo{ background:#fff; color:var(--muted); border:1.5px solid var(--amber-line); }
  .daydot{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; font-size:10px; font-weight:700; }
  .dot-present{ background:var(--ink); color:#fff; }
  .dot-absent{ background:#fff; color:var(--muted); border:1px solid var(--amber-line); }
  .dot-leave{ background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
  .dot-future{ background:transparent; }
  .pill-progress{ background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
  .pill-done{ background:var(--ink); color:#fff; }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty .big{ font-size:32px; margin-bottom:10px; }
  .empty .t{ font-weight:600; color:var(--ink); font-size:14px; margin-bottom:4px; }
  .empty .s{ font-size:12.5px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(36,26,18,0.42); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-bg{ align-items:center; } }
  .modal{ background:var(--panel); border-radius:18px 18px 0 0; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; padding:24px 22px 28px; }
  @media (min-width:640px){ .modal{ border-radius:18px; } }
  .modal h3{ margin:0 0 4px; font-size:18px; }
  .modal .close{ float:right; background:none; border:none; font-size:20px; color:var(--muted); }
  .row-actions{ display:flex; gap:8px; margin-top:4px; }
  .taskcol{ background:#F2F2F2; border-radius:var(--radius); padding:12px; min-height:80px; }
  .taskcol h4{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:2px 6px 10px; }
  .taskcard{ background:var(--panel); border:1px solid var(--amber-line); border-radius:10px; padding:11px 12px; margin-bottom:8px; font-size:13px; }
  .taskcard .tt{ font-weight:600; margin-bottom:4px; }
  .taskcard .meta{ font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .badge-role{ font-size:9.5px; background:var(--musk-soft); color:var(--musk); padding:2px 7px; border-radius:6px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:80; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-row select, .filter-row input[type=date]{ padding:8px 10px; border-radius:8px; border:1.5px solid var(--amber-line); font-size:12.5px; background:#fff; }
  .link-btn{ background:none;border:none;color:var(--oud);font-weight:600;font-size:12.5px; }
  .divider{ height:1px; background:var(--amber-line); margin:18px 0; }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-stage">
    <div class="login-rings" aria-hidden="true">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
    </div>
    <div class="login-card">
      <div class="seal"><img id="loginLogo" alt="Bombay Musk" /></div>
      <div class="wordmark">
        <div class="bottom">Team Hub</div>
      </div>
      <div class="tagline">Attendance · Leaves · Advances · Tasks</div>
      <div class="login-divider"></div>
      <form id="loginForm">
        <div class="field">
          <label>Employee ID</label>
          <input type="text" id="loginId" placeholder="e.g. BM-001" autocomplete="off" required>
        </div>
        <div class="field">
          <label>PIN</label>
          <input type="password" id="loginPin" placeholder="4–6 digit PIN" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <div class="login-error" id="loginError"></div>
      </form>
      <div class="login-hint" id="loginHint" style="display:none;">Setting this up for the first time? Ask your admin for your Employee ID and PIN.</div>
    </div>
    <p class="login-footer">Bombay Musk · Internal Team Access</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="watermark" id="appWatermark"></div>
  <header class="topbar">
    <div class="brand-mini">
      <div class="mark"><img id="headerLogo" alt="Bombay Musk" style="width:100%;height:100%;object-fit:contain;padding:4px;box-sizing:border-box;" /></div>
      <div>
        <div class="name">Bombay Musk</div>
        <div class="sub">TEAM HUB</div>
      </div>
    </div>
    <div class="user-chip">
      <div class="who">
        <div class="n" id="chipName">—</div>
        <div class="r" id="chipRole">—</div>
      </div>
      <div class="avatar" id="chipAvatar">–</div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
    </div>
  </header>

  <main id="mainContent"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
  /* ============================================================
     REAL HOSTED BACKEND (Firebase Firestore + Anonymous Auth)
     Fill in your Firebase project's config below — Bombay Musk
     will send it to you after setting up their free project.
     ============================================================ */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4LUU3aErWFL91oDqLWZpv7VUnIIJ1Rn8",
    authDomain: "internal-software-70a0a.firebaseapp.com",
    projectId: "internal-software-70a0a",
    storageBucket: "internal-software-70a0a.firebasestorage.app",
    messagingSenderId: "282649181388",
    appId: "1:282649181388:web:6409402fcd4b503d1ed669"
  };

  const COLLECTION = "bombayMuskHub";
  let db = null, ready = Promise.resolve();

  if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("FIREBASE_") !== 0){
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
    const auth = getAuth(fbApp);
    ready = new Promise((resolve) => {
      signInAnonymously(auth).then(resolve).catch((e)=>{ console.error('Firebase auth failed', e); resolve(); });
    });
  } else {
    console.warn('Firebase config not set yet — the app will not save or sync data.');
  }

  // Compatible with the same window.storage.get/set calls the app already uses.
  window.storage = {
    get: async (key) => {
      if(!db) return null;
      await ready;
      const snap = await getDoc(doc(db, COLLECTION, key));
      return snap.exists() ? { key, value: snap.data().value } : null;
    },
    set: async (key, value) => {
      if(!db) throw new Error('Firebase not configured');
      await ready;
      await setDoc(doc(db, COLLECTION, key), { value });
      return { key, value };
    }
  };
  window.__storageReady = true;
</script>
<script>
/* ============================================================
   BOMBAY MUSK TEAM HUB — prototype HRMS
   Data is shared cloud storage (window.storage, shared=true)
   so everyone who opens this app sees the same live data.
   ============================================================ */

let DB = { employees: [], teams: [], attendance: {}, leaves: [], advances: [], tasks: [] };

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- storage helpers ---------------- */
async function loadDB(){
  const keys = ['employees','teams','attendance','leaves','advances','tasks'];
  let hadError = false;
  const results = await Promise.all(keys.map(async (k) => {
    try{ return await window.storage.get(k, true); }
    catch(e){ hadError = true; console.error('Failed to load', k, e); return null; }
  }));
  keys.forEach((k, i) => {
    const res = results[i];
    DB[k] = res && res.value ? JSON.parse(res.value) : (k==='attendance' ? {} : []);
  });
  if(hadError){
    // Something failed to load — do NOT treat this as "database is empty".
    // Seeding a fresh admin here would overwrite real data on the next save.
    return false;
  }
  // Only safe to seed a default admin once we've confirmed reads succeeded and it's genuinely empty.
  if(!DB.employees.length){
    DB.employees.push({
      id:'admin', name:'Founder', pin:'8827', role:'FOUNDER', team:null, phone:'', joinDate: todayStr()
    });
    await saveDB('employees');
  }
  return true;
}
function saveDB(key){
  // Optimistic: fire-and-forget so the UI never blocks on network round-trips.
  return window.storage.set(key, JSON.stringify(DB[key]), true)
    .catch(()=> toast('Sync issue — retrying in background.'));
}

/* ---------------- auth ---------------- */
const SESSION_KEY = 'bombayMuskSessionEmployeeId';
$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id = $('#loginId').value.trim();
  const pin = $('#loginPin').value.trim();
  const emp = DB.employees.find(x => x.id.toLowerCase() === id.toLowerCase() && x.pin === pin);
  if(!emp){ $('#loginError').textContent = 'Employee ID or PIN is incorrect.'; return; }
  signInAs(emp);
});
function signInAs(emp){
  CURRENT = emp;
  ACTIVE_TAB = 'dashboard';
  try{ localStorage.setItem(SESSION_KEY, emp.id); }catch(e){}
  $('#loginScreen').style.display = 'none';
  $('#app').style.display = 'block';
  renderShell();
}
function logout(){
  CURRENT = null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  $('#app').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
  $('#loginId').value=''; $('#loginPin').value=''; $('#loginError').textContent='';
}

/* ---------------- shell / tabs ---------------- */
function tabsForRole(role){
  const base = [
    {id:'dashboard', label:'Home', ic:'⌂'},
    {id:'attendance', label:'Attendance', ic:'◔'},
    {id:'leave', label:'Leave', ic:'☾'},
    {id:'advance', label:'Advance', ic:'₹'},
    {id:'tasks', label:'Tasks', ic:'✓'},
  ];
  if(role === 'TEAM_LEAD' || role === 'FOUNDER' || role === 'CORE_TEAM') base.push({id:'team', label:'Team', ic:'◎'});
  if(role === 'TEAM_LEAD' || role === 'FOUNDER' || role === 'CORE_TEAM') base.push({id:'reports', label:'Reports', ic:'▤'});
  if(role === 'FOUNDER') base.push({id:'salary', label:'Salary', ic:'₹'});
  if(role === 'FOUNDER') base.push({id:'people', label:'People', ic:'⚙'});
  return base;
}
function renderShell(){
  $('#chipName').textContent = CURRENT.name;
  $('#chipRole').textContent = CURRENT.role.replace('_',' ');
  $('#chipAvatar').textContent = CURRENT.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const tabs = tabsForRole(CURRENT.role);
  $('#tabbar').innerHTML = tabs.map(t => `
    <button class="tab ${ACTIVE_TAB===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <span class="ic">${t.ic}</span><span>${t.label}</span>
    </button>`).join('');
  renderPage();
}
function switchTab(id){ ACTIVE_TAB = id; renderShell(); }
function renderPage(){
  const map = { dashboard: pageDashboard, attendance: pageAttendance, leave: pageLeave, advance: pageAdvance, tasks: pageTasks, team: pageTeam, reports: pageReports, salary: pageSalary, people: pagePeople };
  if(ACTIVE_TAB === 'salary' && CURRENT.role !== 'FOUNDER'){ ACTIVE_TAB = 'dashboard'; }
  ($('#mainContent').innerHTML = '');
  (map[ACTIVE_TAB] || pageDashboard)();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function openModal(html){ $('#modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }

/* ---------------- shared helpers ---------------- */
function teamName(id){ const t = DB.teams.find(x=>x.id===id); return t ? t.name : '—'; }
function empName(id){ const e = DB.employees.find(x=>x.id===id); return e ? e.name : id; }
function myTeamMemberIds(){
  if(CURRENT.role === 'FOUNDER') return DB.employees.map(e=>e.id);
  if(CURRENT.role === 'CORE_TEAM'){
    const managed = CURRENT.managedTeams || [];
    return DB.employees.filter(e => managed.includes(e.team) || e.id===CURRENT.id).map(e=>e.id);
  }
  const myTeams = DB.teams.filter(t=>t.leadId===CURRENT.id).map(t=>t.id);
  return DB.employees.filter(e => myTeams.includes(e.team) || e.id===CURRENT.id).map(e=>e.id);
}
function hoursBetween(inIso, outIso){
  if(!inIso || !outIso) return null;
  const ms = new Date(outIso) - new Date(inIso);
  return Math.max(0, ms/3600000);
}
function attKey(empId, date){ return empId+'::'+date; }

  const isManager = CURRENT.role === 'FOUNDER' || CURRENT.role === 'TEAM_LEAD';
  let html = `<h2 class="page-title">Hi, ${escapeHtml(CURRENT.name.split(' ')[0])} 👋</h2>
  <p class="page-sub">${new Date().toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long'})}</p>`;

  html += clockCardHTML();

  if(isManager){
    const scopeIds = myTeamMemberIds().filter(id=>id!==CURRENT.id || CURRENT.role==='FOUNDER');
    const total = DB.employees.filter(e=>scopeIds.includes(e.id)).length;
    const presentToday = DB.employees.filter(e=>scopeIds.includes(e.id) && DB.attendance[attKey(e.id, todayStr())]?.checkIn).length;
    const pendingLeaves = DB.leaves.filter(l=>l.status==='PENDING' && scopeIds.includes(l.empId)).length;
    const pendingAdv = DB.advances.filter(a=>a.status==='PENDING' && scopeIds.includes(a.empId)).length;
    const openTasks = DB.tasks.filter(t=>t.status!=='DONE' && scopeIds.includes(t.assignedTo)).length;

    html += `<div class="section-head"><h3>${CURRENT.role==='FOUNDER'?'Company':'Team'} snapshot</h3></div>
    <div class="grid grid-3">
      <div class="stat"><div class="num">${presentToday}/${total}</div><div class="lbl">Checked in today</div></div>
      <div class="stat"><div class="num">${pendingLeaves}</div><div class="lbl">Pending leaves</div></div>
      <div class="stat"><div class="num">${pendingAdv}</div><div class="lbl">Pending advances</div></div>
    </div>
    <div class="grid grid-3" style="margin-top:14px;">
      <div class="stat"><div class="num">${openTasks}</div><div class="lbl">Open tasks</div></div>
      <div class="stat"><div class="num">${DB.teams.length}</div><div class="lbl">Teams</div></div>
      <div class="stat"><div class="num">${total}</div><div class="lbl">People</div></div>
    </div>`;

    if(pendingLeaves || pendingAdv){
      html += `<div class="section-head"><h3>Needs your approval</h3></div><div class="card">`;
      const pl = DB.leaves.filter(l=>l.status==='PENDING' && scopeIds.includes(l.empId)).slice(0,3);
      const pa = DB.advances.filter(a=>a.status==='PENDING' && scopeIds.includes(a.empId)).slice(0,3);
      if(!pl.length && !pa.length) html += `<p class="note">All caught up.</p>`;
      pl.forEach(l => html += rowLine(`${empName(l.empId)} · leave`, `${fmtDate(l.from)} → ${fmtDate(l.to)}`, `<button class="btn btn-sm btn-success" onclick="decideLeave('${l.id}','APPROVED')">Approve</button><button class="btn btn-sm btn-danger" onclick="decideLeave('${l.id}','REJECTED')">Reject</button>`));
      pa.forEach(a => html += rowLine(`${empName(a.empId)} · advance`, `₹${a.amount}`, `<button class="btn btn-sm btn-success" onclick="decideAdvance('${a.id}','APPROVED')">Approve</button><button class="btn btn-sm btn-danger" onclick="decideAdvance('${a.id}','REJECTED')">Reject</button>`));
      html += `</div>`;
    }
  } else {
    // employee view
    const myAtt = Object.keys(DB.attendance).filter(k=>k.startsWith(CURRENT.id+'::'));
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    let weekHrs = 0;
    myAtt.forEach(k=>{
      const d = k.split('::')[1];
      if(new Date(d) >= weekAgo){ const h = hoursBetween(DB.attendance[k].checkIn, DB.attendance[k].checkOut); if(h) weekHrs += h; }
    });
    const myLeaves = DB.leaves.filter(l=>l.empId===CURRENT.id && l.status==='PENDING').length;
    const myTasks = DB.tasks.filter(t=>t.assignedTo===CURRENT.id && t.status!=='DONE').length;
    html += `<div class="grid grid-3" style="margin-top:22px;">
      <div class="stat"><div class="num">${weekHrs.toFixed(1)}h</div><div class="lbl">Hours this week</div></div>
      <div class="stat"><div class="num">${myLeaves}</div><div class="lbl">Pending leave</div></div>
      <div class="stat"><div class="num">${myTasks}</div><div class="lbl">Open tasks</div></div>
    </div>`;
  }
  $('#mainContent').innerHTML = html;
}
function rowLine(title, sub, actions){
  return `<div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--amber-line);">
    <div><div style="font-weight:600; font-size:13.5px;">${escapeHtml(title)}</div><div style="font-size:12px; color:var(--muted);">${escapeHtml(sub)}</div></div>
    <div class="row-actions">${actions}</div>
  </div>`;
}

/* ============================================================
   CLOCK CARD (check in/out)
   ============================================================ */
function clockCardHTML(){
  const key = attKey(CURRENT.id, todayStr());
  const rec = DB.attendance[key];
  const now = new Date();
  let statusLine, btnHtml;
  if(!rec || !rec.checkIn){
    statusLine = 'Not checked in yet';
    btnHtml = `<button class="bigbtn" onclick="doCheckIn()">Check In</button>`;
  } else if(rec.checkIn && !rec.checkOut){
    statusLine = `Checked in at ${fmtTime(rec.checkIn)}`;
    btnHtml = `<button class="bigbtn out" onclick="doCheckOut()">Check Out</button>`;
  } else {
    const h = hoursBetween(rec.checkIn, rec.checkOut);
    statusLine = `In ${fmtTime(rec.checkIn)} · Out ${fmtTime(rec.checkOut)} · ${h.toFixed(1)}h logged`;
    btnHtml = `<button class="bigbtn out" disabled style="opacity:0.6;">Day complete ✓</button>`;
  }
  return `<div class="clockcard" style="margin-top:18px;">
    <div class="time mono">${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
    <div class="date">${now.toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'})}</div>
    <div class="status">${statusLine}</div>
    ${btnHtml}
  </div>`;
}
function doCheckIn(){
  const key = attKey(CURRENT.id, todayStr());
  DB.attendance[key] = { checkIn: new Date().toISOString(), checkOut: null };
  toast('Checked in ✓'); renderPage();
  saveDB('attendance');
}
function doCheckOut(){
  const key = attKey(CURRENT.id, todayStr());
  if(DB.attendance[key]) DB.attendance[key].checkOut = new Date().toISOString();
  toast('Checked out ✓'); renderPage();
  saveDB('attendance');
}

        <td>${h!=null ? h.toFixed(1)+'h' : '—'}</td>
        <td><span class="pill ${rec?.checkIn ? 'pill-present':'pill-absent'}">${rec?.checkIn ? 'Present':'Absent'}</span></td>
        <td><button class="link-btn" onclick="openAttendanceForm('${e.id}','${date}')">Edit</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += `<div class="section-head"><h3>Your history</h3></div><div class="card table-wrap"><table><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>`;

    if(!mine.length) html += `<tr><td colspan="4" class="empty">No records yet — check in above to start.</td></tr>`;

      const h = hoursBetween(rec.checkIn, rec.checkOut);
      html += `<tr><td>${fmtDate(d)}</td><td>${rec.checkIn?fmtTime(rec.checkIn):'—'}</td><td>${rec.checkOut?fmtTime(rec.checkOut):'—'}</td><td>${h!=null?h.toFixed(1)+'h':'—'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  $('#mainContent').innerHTML = html;

function openAttendanceForm(empId, date){
  const rec = DB.attendance[attKey(empId, date)] || {};
  const inVal = rec.checkIn ? new Date(rec.checkIn).toTimeString().slice(0,5) : '';
  const outVal = rec.checkOut ? new Date(rec.checkOut).toTimeString().slice(0,5) : '';
  openModal(`
    <button class="close" onclick="closeModal()">×</button>

    <p class="note" style="margin-bottom:14px;">${escapeHtml(empName(empId))} · ${fmtDate(date)}</p>

    <div class="field"><label>Check-out time</label><input type="time" id="attOut" value="${outVal}"></div>
    <input type="hidden" id="attEmp" value="${empId}"><input type="hidden" id="attDate" value="${date}">
    <button class="btn btn-primary" style="width:100%;" onclick="submitAttendanceEdit()">Save changes</button>
    ${rec.checkIn ? `<button class="btn btn-ghost" style="width:100%; margin-top:8px;" onclick="clearAttendance('${empId}','${date}')">Clear record</button>` : ''}
  `);

function submitAttendanceEdit(){
  const empId = $('#attEmp').value, date = $('#attDate').value;
  const inTime = $('#attIn').value, outTime = $('#attOut').value;
  const key = attKey(empId, date);
  const rec = {};
  rec.checkIn = inTime ? new Date(date+'T'+inTime+':00').toISOString() : null;
  rec.checkOut = outTime ? new Date(date+'T'+outTime+':00').toISOString() : null;
  DB.attendance[key] = rec;
  closeModal(); toast('Attendance updated'); renderPage();
  saveDB('attendance');
}
function clearAttendance(empId, date){
  delete DB.attendance[attKey(empId, date)];
  closeModal(); toast('Record cleared'); renderPage();
  saveDB('attendance');
}

function submitLeave(){

  DB.leaves.push({ id: uid('lv'), empId: CURRENT.id, from, to, reason, status:'PENDING', appliedOn: new Date().toISOString() });
  closeModal(); toast('Leave request submitted'); renderPage();
  saveDB('leaves');

function decideLeave(id, status){
  const l = DB.leaves.find(x=>x.id===id); if(!l) return;
  l.status = status; l.reviewedBy = CURRENT.id;
  toast(`Leave ${status.toLowerCase()}`); renderPage();
  saveDB('leaves');
}

function daysInMonth(ym){ // ym = 'YYYY-MM'
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function pageReports(){

  if(!people.length){
    html += `<div class="empty"><div class="big">▤</div><div class="t">No one to show</div><div class="s">Add people to your team to see their attendance here.</div></div>`;
  } else {

    for(let d=1; d<=totalDays; d++) html += `<th style="text-align:center; min-width:26px;">${d}</th>`;

  }

  monthLeaves.forEach(l=> html += `<tr><td>${escapeHtml(empName(l.empId))}</td><td>${fmtDate(l.from)}</td><td>${fmtDate(l.to)}</td><td>${escapeHtml(l.reason)}</td><td><span class="pill pill-${l.status.toLowerCase()}">${l.status}</span></td></tr>`);
  html += `</tbody></table></div>`;

function dayCell(empId, date){
  const rec = DB.attendance[attKey(empId, date)];
  if(rec && rec.checkIn){
    const h = hoursBetween(rec.checkIn, rec.checkOut);
    return { status:'P', cls:'dot-present', label:'P', hours:h||0, title:`${fmtTime(rec.checkIn)}${rec.checkOut?' – '+fmtTime(rec.checkOut):''}` };
  }
  const onLeave = DB.leaves.some(l => l.empId===empId && l.status==='APPROVED' && l.from<=date && l.to>=date);
  if(onLeave) return { status:'L', cls:'dot-leave', label:'L', title:'Approved leave' };
  if(date > todayStr()) return { status:'', cls:'dot-future', label:'', title:'' };
  return { status:'A', cls:'dot-absent', label:'A', title:'Absent' };
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadAttendanceCsv(ym){
  const totalDays = daysInMonth(ym);
  const scopeIds = myTeamMemberIds().filter(id=>id!==CURRENT.id || CURRENT.role==='FOUNDER');
  const teamFilter = window.__reportTeam || '';
  let people = DB.employees.filter(e=>scopeIds.includes(e.id));
  if(teamFilter) people = people.filter(e=>e.team===teamFilter);
  const rows = [['Employee','Employee ID','Team','Date','Status','Check-in','Check-out','Hours']];
  people.forEach(e=>{
    for(let d=1; d<=totalDays; d++){
      const date = ym+'-'+String(d).padStart(2,'0');
      const rec = DB.attendance[attKey(e.id, date)];
      const cell = dayCell(e.id, date);
      if(!cell.status) continue; // skip future dates
      rows.push([e.name, e.id, teamName(e.team), date, cell.status==='P'?'Present':cell.status==='L'?'Leave':'Absent',
        rec?.checkIn?fmtTime(rec.checkIn):'', rec?.checkOut?fmtTime(rec.checkOut):'', cell.hours?cell.hours.toFixed(2):'']);
    }

  downloadCsv(`bombay-musk-attendance-${ym}.csv`, rows);
  toast('Attendance CSV downloaded');
}

/* ============================================================
   SALARY CALCULATOR (founder only)
   ============================================================ */
function isSunday(date){ return new Date(date+'T00:00:00').getDay() === 0; }
function calcSalary(emp, ym){
  const totalDays = daysInMonth(ym);
  const currentYM = todayStr().slice(0,7);
  let lastDay;
  if(ym < currentYM) lastDay = totalDays;
  else if(ym > currentYM) lastDay = 0;
  else lastDay = Number(todayStr().slice(8,10));

  let present=0, paidLeave=0, sundaysPaid=0, absent=0;
  for(let d=1; d<=lastDay; d++){
    const date = ym+'-'+String(d).padStart(2,'0');
    const cell = dayCell(emp.id, date);
    if(cell.status==='P') present++;
    else if(cell.status==='L') paidLeave++;
    else if(cell.status==='A'){
      if(isSunday(date)) sundaysPaid++;
      else absent++;
    }
  }
  const isDaily = emp.salaryType === 'DAILY';
  const baseSalary = emp.baseSalary || 0;
  const dailyRate = emp.dailyRate || 0;
  const perDayRate = isDaily ? dailyRate : (baseSalary / totalDays);
  const payableDays = present + paidLeave + sundaysPaid;
  const grossEarned = perDayRate * payableDays;
  const advances = DB.advances
    .filter(a => a.empId===emp.id && a.status==='APPROVED' && a.appliedOn.slice(0,7)===ym)
    .reduce((sum,a)=>sum+a.amount, 0);
  const netPayable = grossEarned - advances;
  return { present, paidLeave, sundaysPaid, absent, perDayRate, payableDays, grossEarned, advances, netPayable, baseSalary, dailyRate, isDaily };
}
function pageSalary(){
  const ym = window.__salaryMonth || todayStr().slice(0,7);
  const monthLabel = new Date(ym+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long', year:'numeric'});

  if(teamFilter) people = people.filter(e=>e.team===teamFilter);

  let html = `<h2 class="page-title">Salary calculator</h2><p class="page-sub">${monthLabel} — based on attendance, approved leave, and advances.</p>`;
  html += `<div class="filter-row">
    <input type="month" value="${ym}" onchange="window.__salaryMonth=this.value; renderPage();">
    <select onchange="window.__salaryTeam=this.value; renderPage();">
      <option value="">All teams</option>
      ${DB.teams.map(t=>`<option value="${t.id}" ${teamFilter===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}
    </select>
    <button class="btn btn-ghost btn-sm" onclick="downloadSalaryCsv('${ym}')">⬇ Salary CSV</button>
  </div>`;

  const withSalary = people.filter(e=>e.baseSalary || e.dailyRate);
  const withoutSalary = people.filter(e=>!e.baseSalary && !e.dailyRate);

  if(!withSalary.length){
    html += `<div class="empty"><div class="big">₹</div><div class="t">No salaries set yet</div><div class="s">Add a monthly salary or per-day rate to each person in People to see calculations here.</div></div>`;
  } else {
    let totalPayable = 0;
    html += `<div class="card table-wrap"><table><thead><tr><th>Name</th><th>Rate</th><th>Present</th><th>Leave</th><th>Sundays</th><th>Absent</th><th>Gross</th><th>Advances</th><th>Net payable</th></tr></thead><tbody>`;
    withSalary.forEach(e=>{
      const r = calcSalary(e, ym);
      totalPayable += r.netPayable;
      const rateLabel = r.isDaily ? `₹${r.dailyRate.toLocaleString('en-IN')}/day` : `₹${r.baseSalary.toLocaleString('en-IN')}/mo`;
      html += `<tr><td style="font-weight:600;">${escapeHtml(e.name)}</td><td class="mono">${rateLabel}</td>
        <td class="mono">${r.present}</td><td class="mono">${r.paidLeave}</td><td class="mono">${r.sundaysPaid}</td>
        <td class="mono" style="color:var(--danger);">${r.absent}</td>
        <td class="mono">₹${r.grossEarned.toFixed(0)}</td>
        <td class="mono" style="color:var(--danger);">${r.advances?'−₹'+r.advances.toLocaleString('en-IN'):'—'}</td>
        <td class="mono" style="font-weight:700; color:var(--musk);">₹${r.netPayable.toFixed(0)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr style="border-top:2px solid var(--amber-line);"><td colspan="8" style="font-weight:700;">Total payable this month</td><td class="mono" style="font-weight:700; font-size:15px;">₹${totalPayable.toFixed(0)}</td></tr></tfoot></table></div>`;
  }

  if(withoutSalary.length){
    html += `<div class="section-head"><h3>No salary set (${withoutSalary.length})</h3></div>
    <div class="card"><p class="note">${withoutSalary.map(e=>escapeHtml(e.name)).join(', ')} — edit them in People to add a monthly salary or per-day rate.</p></div>`;
  }

  html += `<p class="note" style="margin-top:18px;">This is a working estimate for internal reference: pay rate (monthly ÷ days in month, or a set per-day rate) × days paid (present + approved leave + Sundays), minus advances approved this month. It doesn't account for PF, ESI, professional tax, or TDS — run final numbers through your accountant before disbursing.</p>`;
  $('#mainContent').innerHTML = html;
}
function downloadSalaryCsv(ym){
  const teamFilter = window.__salaryTeam || '';
  let people = DB.employees.filter(e=>e.baseSalary || e.dailyRate);
  if(teamFilter) people = people.filter(e=>e.team===teamFilter);
  const rows = [['Employee','Employee ID','Team','Salary Type','Monthly Salary','Daily Rate','Present','Paid Leave','Sundays Paid','Absent','Effective Per-day Rate','Gross Earned','Advances Deducted','Net Payable']];

}

function deleteTeam(teamId){
  const team = DB.teams.find(t=>t.id===teamId);
  if(!team) return;
  const memberCount = DB.employees.filter(e=>e.team===teamId).length;
  const overseerCount = DB.employees.filter(e=>e.role==='CORE_TEAM' && (e.managedTeams||[]).includes(teamId)).length;
  let msg = `Delete "${team.name}"?`;
  if(memberCount) msg += ` ${memberCount} employee${memberCount>1?'s':''} will be unassigned from it.`;
  if(overseerCount) msg += ` It will be removed from ${overseerCount} Core Team member${overseerCount>1?"'s":"'s"} oversight list.`;
  if(!confirm(msg)) return;

  DB.teams = DB.teams.filter(t=>t.id!==teamId);
  DB.employees.forEach(e=>{
    if(e.team===teamId) e.team = null;
    if(e.managedTeams && e.managedTeams.includes(teamId)) e.managedTeams = e.managedTeams.filter(t=>t!==teamId);
  });
  toast('Team deleted'); renderPage();
  saveDB('teams'); saveDB('employees');
}

    </select></div>
    <input type="hidden" id="teamEditId" value="${existing?existing.id:''}">
    <button class="btn btn-primary" style="width:100%;" onclick="submitTeam()">${existing?'Save changes':'Create team'}</button>
  `);
}
function submitTeam(){
  const editId = $('#teamEditId').value;
  const name = $('#teamName').value.trim();
  const leadId = $('#teamLead').value || null;
  if(!name){ toast('Enter a team name'); return; }
  if(editId){
    const t = DB.teams.find(x=>x.id===editId);
    if(!t){ toast('Team not found'); return; }
    t.name = name; t.leadId = leadId;
    let empChanged = false;
    if(leadId){
      const emp = DB.employees.find(x=>x.id===leadId);
      if(emp && emp.role!=='FOUNDER' && (emp.role!=='TEAM_LEAD' || emp.team!==editId)){
        emp.role = 'TEAM_LEAD'; emp.team = editId; empChanged = true;
      }
    }
    closeModal(); toast('Team updated'); renderPage();
    saveDB('teams');
    if(empChanged) saveDB('employees');
    return;
  }
  DB.teams.push({ id: uid('team'), name, leadId });
  closeModal(); toast('Team created'); renderPage();
  saveDB('teams');
}
function openEmployeeForm(editId){
  const existing = editId ? DB.employees.find(e=>e.id===editId) : null;
  openModal(`
    <button class="close" onclick="closeModal()">×</button>
    <h3>${existing ? 'Edit person' : 'Add a person'}</h3>
    <div class="field"><label>Full name</label><input type="text" id="epName" value="${existing?escapeHtml(existing.name):''}" required></div>
    <div class="field"><label>Employee ID ${existing?'(cannot be changed — used to log in)':'(used to log in)'}</label><input type="text" id="epId" value="${existing?existing.id:''}" placeholder="e.g. BM-014" ${existing?'disabled':''} required></div>
    <div class="field"><label>PIN</label><input type="text" id="epPin" value="${existing?existing.pin:''}" placeholder="4–6 digits" required></div>
    <div class="field"><label>Role</label><select id="epRole" onchange="toggleManagedTeamsField()">
      <option value="EMPLOYEE" ${existing&&existing.role==='EMPLOYEE'?'selected':''}>Employee</option>
      <option value="TEAM_LEAD" ${existing&&existing.role==='TEAM_LEAD'?'selected':''}>Team lead</option>
      <option value="CORE_TEAM" ${existing&&existing.role==='CORE_TEAM'?'selected':''}>Core team</option>
      ${existing&&existing.role==='FOUNDER' ? '<option value="FOUNDER" selected>Founder</option>' : ''}
    </select></div>
    <div class="field"><label>Team</label><select id="epTeam"><option value="">— none —</option>${DB.teams.map(t=>`<option value="${t.id}" ${existing&&existing.team===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></div>
    <div class="field" id="epManagedTeamsField">
      <label>Teams they oversee (Core team)</label>
      <div style="border:1.5px solid var(--amber-line); border-radius:10px; padding:10px 13px; max-height:160px; overflow-y:auto;">
        ${DB.teams.length ? DB.teams.map(t=>`
          <label style="display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px; font-weight:400; text-transform:none; letter-spacing:normal; color:var(--ink);">
            <input type="checkbox" class="epManagedTeamChk" value="${t.id}" ${existing&&existing.managedTeams&&existing.managedTeams.includes(t.id)?'checked':''}>
            ${escapeHtml(t.name)}
          </label>`).join('') : '<p class="note">Create a team first.</p>'}
      </div>
    </div>
    <div class="field"><label>Salary type</label><select id="epSalaryType" onchange="toggleSalaryFields()">
      <option value="MONTHLY" ${!existing||existing.salaryType!=='DAILY'?'selected':''}>Monthly salary</option>
      <option value="DAILY" ${existing&&existing.salaryType==='DAILY'?'selected':''}>Per-day rate</option>
    </select></div>
    <div class="field" id="epMonthlyField"><label>Monthly salary (₹, optional)</label><input type="number" id="epSalary" min="0" value="${existing&&existing.baseSalary?existing.baseSalary:''}" placeholder="e.g. 25000"></div>
    <div class="field" id="epDailyField"><label>Per-day rate (₹, optional)</label><input type="number" id="epDailyRate" min="0" value="${existing&&existing.dailyRate?existing.dailyRate:''}" placeholder="e.g. 900"></div>
    <input type="hidden" id="epEditId" value="${existing?existing.id:''}">
    <button class="btn btn-primary" style="width:100%;" onclick="submitEmployee()">${existing?'Save changes':'Add person'}</button>
  `);
  toggleSalaryFields();
  toggleManagedTeamsField();
}
function toggleManagedTeamsField(){
  const role = $('#epRole').value;
  $('#epManagedTeamsField').style.display = role==='CORE_TEAM' ? 'block' : 'none';
}
function toggleSalaryFields(){
  const type = $('#epSalaryType').value;
  $('#epMonthlyField').style.display = type==='MONTHLY' ? 'block' : 'none';
  $('#epDailyField').style.display = type==='DAILY' ? 'block' : 'none';
}
function submitEmployee(){
  const editId = $('#epEditId').value;
  const name = $('#epName').value.trim(), pin = $('#epPin').value.trim();
  const role = $('#epRole').value, team = $('#epTeam').value || null;
  const managedTeams = role==='CORE_TEAM' ? $$('.epManagedTeamChk:checked').map(el=>el.value) : [];
  const salaryType = $('#epSalaryType').value;
  const salaryRaw = $('#epSalary').value;
  const dailyRaw = $('#epDailyRate').value;
  const baseSalary = salaryRaw ? parseFloat(salaryRaw) : null;
  const dailyRate = dailyRaw ? parseFloat(dailyRaw) : null;
  if(!name || !pin){ toast('Fill in all required fields'); return; }

  if(editId){
    const emp = DB.employees.find(e=>e.id===editId);
    if(!emp){ toast('Person not found'); return; }
    emp.name = name; emp.pin = pin; emp.role = role; emp.team = team; emp.managedTeams = managedTeams;
    emp.salaryType = salaryType; emp.baseSalary = baseSalary; emp.dailyRate = dailyRate;
    let teamsChanged = false;
    DB.teams.forEach(t=>{
      if(t.leadId===editId && (role!=='TEAM_LEAD' || t.id!==team)){ t.leadId = null; teamsChanged = true; }
    });
    if(role==='TEAM_LEAD' && team){
      const t = DB.teams.find(x=>x.id===team);
      if(t && t.leadId!==editId){ t.leadId = editId; teamsChanged = true; }
    }
    closeModal(); toast('Updated'); renderPage();
    saveDB('employees');
    if(teamsChanged) saveDB('teams');
    return;
  }

  const id = $('#epId').value.trim();
  if(!id){ toast('Enter an employee ID'); return; }
  if(DB.employees.some(e=>e.id.toLowerCase()===id.toLowerCase())){ toast('That Employee ID is already in use'); return; }
  DB.employees.push({ id, name, pin, role, team, managedTeams, salaryType, baseSalary, dailyRate, joinDate: todayStr() });
  let teamChanged = false;
  if(role === 'TEAM_LEAD' && team){
    const t = DB.teams.find(x=>x.id===team); if(t){ t.leadId = id; teamChanged = true; }
  }
  closeModal(); toast(`${name} added`); renderPage();
  saveDB('employees');
  if(teamChanged) saveDB('teams');
}
function removeEmployee(id){
  DB.employees = DB.employees.filter(e=>e.id!==id);
  DB.teams.forEach(t=>{ if(t.leadId===id) t.leadId=null; });
  toast('Removed'); renderPage();
  saveDB('employees'); saveDB('teams');
}

/* ---------------- boot ---------------- */
(async function init(){
  $('#loginLogo').src = LOGO_FULL;
  $('#headerLogo').src = LOGO_MONO;
  $('#appWatermark').style.backgroundImage = `url('${LOGO_MONO}')`;

  // wait for the Firebase module script to define window.storage (script load order isn't guaranteed)
  let waited = 0;
  while(!window.__storageReady && waited < 4000){ await new Promise(r=>setTimeout(r,20)); waited += 20; }

  if(!window.storage){
    $('#loginHint').style.display = 'block';
    $('#loginHint').innerHTML = '<b>Setup needed:</b> this copy isn\'t connected to a database yet. Ask whoever built this to finish the Firebase setup.';
    $('#loginError').textContent = '';
    return;
  }
  const loaded = await loadDB();
  if(!loaded){
    $('#loginHint').style.display = 'block';
    $('#loginHint').innerHTML = '<b>Connection issue:</b> couldn\'t reach the database. Check your internet connection and reload the page.';
    $('#loginError').textContent = '';
    return;
  }

  // Auto sign-in if this device already has a saved session
  try{
    const savedId = localStorage.getItem(SESSION_KEY);
    if(savedId){
      const emp = DB.employees.find(e => e.id === savedId);
      if(emp) signInAs(emp);
      else localStorage.removeItem(SESSION_KEY); // stale/removed account
    }
  }catch(e){}
})();
</script>
</body>
